events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream services in Docker network
    upstream api_backend {
        server api:4000;
    }

    upstream web_frontend {
        server web:3000;
    }

    # -------------------------------------------------------------
    # 1. Master Domain: flexcoop.tuntongtech.com
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name flexcoop.tuntongtech.com localhost;

        # API routing
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # Frontend routing
        location / {
            proxy_pass http://web_frontend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # -------------------------------------------------------------
    # 2. Dynamic Tenant Subdomains: <tenantname>-flexcoop.tuntongtech.com
    # -------------------------------------------------------------
    server {
        listen 80;
        server_name ~^(?<tenant>[a-zA-Z0-9_-]+)-flexcoop\.tuntongtech\.com$ ~^(?<tenant_local>[a-zA-Z0-9_-]+)-flexcoop\.localhost$;

        # API routing with tenant header injection
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Tenant-Slug $tenant;
        }

        # Frontend routing with tenant header injection
        location / {
            proxy_pass http://web_frontend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Tenant-Slug $tenant;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
