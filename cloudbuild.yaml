steps:
  # 1. Build API container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/coop-solution/cloud-run-source-deploy/flexcoop-api:latest'
      - '-f'
      - 'apps/api/Dockerfile'
      - '.'

  # 2. Push API container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/coop-solution/cloud-run-source-deploy/flexcoop-api:latest'

  # 3. Build Web Portal container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://flexcoop-api-607281616647.asia-southeast1.run.app/api/v1'
      - '--build-arg'
      - 'INTERNAL_API_URL=https://flexcoop-api-607281616647.asia-southeast1.run.app'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/coop-solution/cloud-run-source-deploy/flexcoop-web:latest'
      - '-f'
      - 'apps/admin-portal/Dockerfile'
      - '.'

  # 4. Push Web Portal container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast1-docker.pkg.dev/coop-solution/cloud-run-source-deploy/flexcoop-web:latest'

images:
  - 'asia-southeast1-docker.pkg.dev/coop-solution/cloud-run-source-deploy/flexcoop-api:latest'
  - 'asia-southeast1-docker.pkg.dev/coop-solution/cloud-run-source-deploy/flexcoop-web:latest'

options:
  machineType: 'E2_MEDIUM'
  logging: CLOUD_LOGGING_ONLY
