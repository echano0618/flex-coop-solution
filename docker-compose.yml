version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Reverse Proxy & Gateway (Nginx)
  # Dynamic routing for flexcoop.tuntongtech.com & <tenant>-flexcoop.tuntongtech.com
  # -------------------------------------------------------------
  gateway:
    image: nginx:1.25-alpine
    container_name: flexcoop_gateway
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  # -------------------------------------------------------------
  # 2. Next.js 14 Admin & Member Web Portal
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/admin-portal/Dockerfile
    container_name: flexcoop_web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:4000/api/v1
      - NEXT_PUBLIC_ROOT_DOMAIN=coop.tuntongtech.com
    ports:
      - "3000:3000"
    restart: unless-stopped

  # -------------------------------------------------------------
  # 3. Core Modular Monolith API
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: flexcoop_api
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=flexcoop_jwt_signing_secret_key_2026
      - ROOT_DOMAIN=coop.tuntongtech.com
      - FIRESTORE_EMULATOR_HOST=firebase-emulator:8080
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099
      - FIREBASE_STORAGE_EMULATOR_HOST=firebase-emulator:9199
      - FIREBASE_PROJECT_ID=flex-coop-solution
    ports:
      - "4000:4000"
    depends_on:
      - firebase-emulator
      - redis
    restart: unless-stopped

  # -------------------------------------------------------------
  # 4. Firebase Emulator Suite (Firestore, Auth, Storage, UI)
  # -------------------------------------------------------------
  firebase-emulator:
    image: spine3/firebase-tools:latest
    container_name: flexcoop_firebase
    environment:
      - FIREBASE_PROJECT_ID=flex-coop-solution
    ports:
      - "8080:8080" # Firestore Emulator
      - "9099:9099" # Auth Emulator
      - "9199:9199" # Storage Emulator
      - "4001:4001" # Emulator UI
    volumes:
      - ./firebase.json:/app/firebase.json:ro
      - ./firestore.rules:/app/firestore.rules:ro
      - ./firestore.indexes.json:/app/firestore.indexes.json:ro
      - ./storage.rules:/app/storage.rules:ro
    working_dir: /app
    command: ["firebase", "emulators:start", "--project", "flex-coop-solution"]
    restart: unless-stopped

  # -------------------------------------------------------------
  # 5. Redis (PayMongo Idempotency Cache & Rate Limiting)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: flexcoop_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
